name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p ace

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ace dist/ace-linux-x86_64
          tar -czf dist/ace-linux-x86_64.tar.gz -C dist ace-linux-x86_64
          rm dist/ace-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ace-linux-x86_64.tar.gz